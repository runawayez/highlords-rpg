<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highlords RPG — P2P</title><style>
:root{font-family:system-ui,sans-serif;background:#10141d;color:#e9eef8}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{border:0;background:#8675df;color:#fff;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,textarea{background:#202737;color:#fff;border:1px solid #465069;border-radius:8px;padding:10px}label{font-size:13px}section{padding:18px;background:#1a2030;border:1px solid #35405a;border-radius:12px;margin:12px}h1{margin:0}#home{max-width:670px;margin:10vh auto}#game{display:none}header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#1a2030}header small{color:#afb9d0}#layout{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 68px)}#board{position:relative;overflow:hidden;background:#0b0f17;touch-action:none;cursor:grab}#canvas{position:absolute;left:0;top:0;width:1200px;height:800px;transform-origin:0 0;background:#273047}#map{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none}#grid{position:absolute;inset:0;pointer-events:none;background-size:60px 60px;background-image:linear-gradient(to right,#ffffff24 1px,transparent 1px),linear-gradient(to bottom,#ffffff24 1px,transparent 1px)}#pieces{position:absolute;inset:0}.piece{position:absolute;border-radius:50%;width:56px;height:56px;border:3px solid #fff;display:grid;place-items:center;user-select:none;font-weight:bold;text-shadow:0 1px 2px #000;cursor:move;font-size:12px;text-align:center}aside{background:#171d2b;overflow:auto;padding:12px}aside section{margin:0 0 12px;padding:12px}#history{height:170px;overflow:auto;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}input[type=file]{width:100%}.row{display:flex;gap:7px;margin:8px 0;align-items:center}.row input{min-width:0;flex:1}.muted{color:#a2b0cb;font-size:13px}#notice{color:#f6bd7e}#assets{font-size:12px}#players{font-size:13px}#characters{max-height:240px;overflow:auto}.char{background:#202737;padding:8px;border-radius:7px;margin-bottom:8px}.char textarea{width:100%;height:70px}.char select{width:100%;background:#202737;color:white;padding:5px}#status{margin-left:auto}@media(max-width:750px){#layout{display:flex;flex-direction:column;height:auto}#board{height:58vh}aside{min-height:50vh}}
</style></head><body>
<main id="home"><h1>⚔ Highlords RPG</h1><p class="muted">Uma mesa virtual. Sem contas. Seu navegador hospeda a campanha.</p><section><h2>Criar mesa</h2><div class="row"><input id="hostName" placeholder="Nome do mestre" value="Mestre"><button id="host">Criar</button></div><label>Retomar campanha salva: <input id="load" type="file" accept=".highlords,application/json"></label><p class="muted">Um arquivo .highlords salva a campanha e não contém credenciais de jogadores.</p></section><section><h2>Entrar na mesa</h2><div class="row"><input id="guestName" placeholder="Seu apelido"><input id="roomCode" placeholder="Código da mesa"><button id="join">Entrar</button></div></section><p id="notice" role="status"></p></main>
<div id="game"><header><strong>⚔ Highlords RPG</strong><small id="roomLabel"></small><span id="status">Preparando…</span><button id="invite">Copiar convite</button><button id="export">Exportar .highlords</button></header><div id="layout"><div id="board"><div id="canvas"><img id="map" alt=""><div id="grid"></div><div id="pieces"></div></div></div><aside><section id="masterTools"><h3>Ferramentas do mestre</h3><label>Mapa <input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="row"><input id="tokenName" placeholder="Nome do token"><button id="addToken">Adicionar token</button></div><div class="row"><input id="charName" placeholder="Novo personagem"><button id="addChar">Criar ficha</button></div><div id="players"></div></section><section><h3>Fichas</h3><div id="characters"></div></section><section><h3>Rolagem e conversa</h3><div id="history"></div><div class="row"><input id="message" placeholder="Mensagem"><button id="send">Enviar</button></div><div class="row"><input id="dice" value="1d20"><button id="roll">Rolar</button></div></section><p id="saveStatus" class="muted"></p></aside></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),now=()=>Date.now();
const state={title:'Mesa sem título',tokens:[],characters:[],chat:[],map:'',updated:now(),schema:1};
const contacts=new Map();let hostMode=false,peer,hostLink=null,roomId='',myId='',nickname='',revision=0,drag=null,zoom=.8,offset={x:40,y:30},saveTimer,saveDb;
function announce(t){$('notice').textContent=t;$('status').textContent=t}
function identity(){let id=localStorage.getItem('hl-identity');if(!id){id=uid();localStorage.setItem('hl-identity',id)}return id}
function isValidState(s){return s&&s.schema===1&&Array.isArray(s.tokens)&&Array.isArray(s.characters)&&Array.isArray(s.chat)&&typeof s.map==='string'&&s.map.length<9000000}
async function openDb(){return new Promise((resolve,reject)=>{let r=indexedDB.open('highlords-p2p',1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveLocal(){if(!hostMode)return;try{saveDb ||= await openDb();await new Promise((resolve,reject)=>{const tx=saveDb.transaction('saves','readwrite');tx.objectStore('saves').put(JSON.parse(JSON.stringify(state)),'latest');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});$('saveStatus').textContent='✓ Autosave local confirmado · '+new Date().toLocaleTimeString()}catch(e){$('saveStatus').textContent='⚠ Falha no autosave: '+e.message}}
function scheduleSave(){if(!hostMode)return;$('saveStatus').textContent='Alterações pendentes de salvamento';clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,1500)}
function changed(){state.updated=now();revision++;scheduleSave();render();for(const c of contacts.values())if(c.open)c.send({kind:'state',state,revision})}
function update(fn){if(!hostMode)return;fn();changed()}
function saveFile(){if(!hostMode)return;const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='campanha-'+new Date().toISOString().slice(0,10)+'.highlords';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function restore(file){if(!file)return;try{if(file.size>10000000)throw Error('Máximo 10MB');const obj=JSON.parse(await file.text());if(!isValidState(obj))throw Error('Formato inválido');Object.assign(state,obj);$('notice').textContent='Campanha carregada. Crie a mesa.'}catch(e){announce(e.message)}}
async function startHost(){if(!window.Peer)return announce('PeerJS indisponível, verifique conexão');hostMode=true;nickname=$('hostName').value.trim()||'Mestre';myId=identity();roomId='hl-'+uid();peer=new Peer(roomId);peer.on('open',()=>{showGame();announce('Mesa pronta · aguardando jogadores');changed()});peer.on('connection',c=>{if(contacts.size>=8){c.close();return}attach(c)});peer.on('error',e=>announce('Falha P2P: '+e.message));}
function startGuest(){if(!window.Peer)return announce('PeerJS indisponível');roomId=$('roomCode').value.trim();nickname=$('guestName').value.trim()||'Jogador';if(!/^hl-[a-f0-9-]{36}$/.test(roomId))return announce('Código inválido');myId=identity();peer=new Peer();peer.on('open',()=>{hostLink=peer.connect(roomId,{reliable:true});attach(hostLink,true)});peer.on('error',e=>announce('Conexão falhou: '+e.message))}
function attach(c,guest=false){c.on('open',()=>{if(guest){c.send({kind:'hello',identity:myId,name:nickname});showGame();announce('Conectado ao mestre')}else announce('Jogador conectado')});c.on('data',m=>{if(!m||typeof m!=='object')return;if(hostMode){if(m.kind==='hello'){c.playerId=String(m.identity||'').slice(0,64);c.playerName=String(m.name||'Jogador').slice(0,36);contacts.set(c.peer,c);c.send({kind:'state',state,revision});render()}else if(m.kind==='action'&&c.playerId)apply(m.action,m.payload,c.playerId,c.playerName)}else if(m.kind==='state'&&isValidState(m.state)&&Number.isInteger(m.revision)&&m.revision>=revision){revision=m.revision;Object.assign(state,m.state);render()}});c.on('close',()=>{contacts.delete(c.peer);announce('Jogador desconectado');render()});c.on('error',e=>announce('Erro de conexão: '+e.message))}
function dispatch(action,payload){if(hostMode)apply(action,payload,myId,nickname);else if(hostLink?.open)hostLink.send({kind:'action',action,payload});else announce('Sem conexão com o mestre')}
function apply(action,p,id,name){if(!p||typeof p!=='object')return;const owner=state.characters.find(x=>x.id===p.id);switch(action){
case 'chat':{const text=String(p.text||'').slice(0,600).trim();if(!text)return;return update(()=>{state.chat.push({name,text});state.chat=state.chat.slice(-100)})}
case 'roll':{let m=/^(\d{1,2})d(4|6|8|10|12|20|100)([+-]\d{1,3})?$/i.exec(String(p.expr||'').replace(/\s/g,''));if(!m||+m[1]>30)return;let rolls=Array.from({length:+m[1]},()=>crypto.getRandomValues(new Uint32Array(1))[0]%(+m[2])+1);return update(()=>{state.chat.push({name,text:'🎲 '+m[0]+' → '+rolls.join(', ')+' = '+(rolls.reduce((a,b)=>a+b,0)+Number(m[3]||0))});state.chat=state.chat.slice(-100)})}
case 'move':{if(!state.tokens.some(t=>t.id===p.id)||!Number.isFinite(p.x)||!Number.isFinite(p.y))return;return update(()=>{let t=state.tokens.find(t=>t.id===p.id);t.x=Math.max(0,Math.min(1140,p.x));t.y=Math.max(0,Math.min(740,p.y))})}
case 'character:update':{if(!owner||(id!==myId&&owner.owner!==id)||typeof p.text!=='string')return;return update(()=>{owner.text=p.text.slice(0,5000)})}
case 'character:assign':{if(id!==myId||!owner)return;return update(()=>{owner.owner=String(p.playerId||'').slice(0,64)})}
case 'character:add':{if(id!==myId||state.characters.length>=40)return;return update(()=>{state.characters.push({id:uid(),name:String(p.name||'Personagem').slice(0,50),text:'',owner:''})})}
case 'token:add':{if(id!==myId||state.tokens.length>=120)return;return update(()=>{state.tokens.push({id:uid(),name:String(p.name||'Token').slice(0,35),x:200,y:180})})}
case 'map':{if(id!==myId||typeof p.data!=='string'||p.data.length>8500000||!/^data:image\/(png|jpeg|webp);base64,/.test(p.data))return;return update(()=>state.map=p.data)}
}}
function showGame(){$('home').style.display='none';$('game').style.display='block';$('masterTools').style.display=hostMode?'block':'none';$('export').style.display=hostMode?'block':'none';$('roomLabel').textContent='Sala '+roomId;render()}
function render(){if($('game').style.display==='none')return;$('map').src=state.map||'';const pieces=$('pieces');pieces.replaceChildren();for(const t of state.tokens){let el=document.createElement('div');el.className='piece';el.textContent=t.name;el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.background='#7856c1';el.onpointerdown=e=>{e.stopPropagation();drag={token:t.id,start:[e.clientX,e.clientY],x:t.x,y:t.y};el.setPointerCapture(e.pointerId)};pieces.append(el)}
const h=$('history');h.replaceChildren();for(let line of state.chat){const p=document.createElement('p');p.textContent=line.name+': '+line.text;h.append(p)}h.scrollTop=h.scrollHeight;
const players=[{id:myId,name:nickname},...Array.from(contacts.values()).filter(c=>c.playerId).map(c=>({id:c.playerId,name:c.playerName}))];$('players').textContent='Conectados: '+players.map(x=>x.name).join(', ');
const ch=$('characters');ch.replaceChildren();for(const c of state.characters){let section=document.createElement('div');section.className='char',strong=document.createElement('strong');strong.textContent=c.name;section.append(strong);if(hostMode){let selector=document.createElement('select');let empty=document.createElement('option');empty.value='';empty.textContent='Sem dono';selector.append(empty);for(let x of players){let op=document.createElement('option');op.value=x.id;op.textContent=x.name;selector.append(op)}selector.value=c.owner;selector.onchange=()=>dispatch('character:assign',{id:c.id,playerId:selector.value});section.append(selector)}
let field=document.createElement('textarea');field.value=c.text;field.disabled=!hostMode&&c.owner!==myId;section.append(field);if(!field.disabled){let b=document.createElement('button');b.textContent='Salvar ficha';b.onclick=()=>dispatch('character:update',{id:c.id,text:field.value});section.append(b)}ch.append(section)}
}
$('host').onclick=startHost;$('join').onclick=startGuest;$('load').onchange=e=>restore(e.target.files[0]);$('export').onclick=saveFile;$('invite').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+roomId).then(()=>announce('Convite copiado')).catch(()=>prompt('Convite:',location.origin+location.pathname+'?room='+roomId));$('addChar').onclick=()=>dispatch('character:add',{name:$('charName').value});$('addToken').onclick=()=>dispatch('token:add',{name:$('tokenName').value});$('send').onclick=()=>{dispatch('chat',{text:$('message').value});$('message').value=''};$('roll').onclick=()=>dispatch('roll',{expr:$('dice').value});
$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>6000000)return announce('Mapa excede 6MB');const reader=new FileReader();reader.onload=()=>dispatch('map',{data:reader.result});reader.readAsDataURL(f)};
const board=$('board');function transform(){$('canvas').style.transform='translate('+offset.x+'px,'+offset.y+'px) scale('+zoom+')'}board.onpointerdown=e=>{drag={pan:true,start:[e.clientX,e.clientY],x:offset.x,y:offset.y}};document.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.start[0],dy=e.clientY-drag.start[1];if(drag.pan){offset.x=drag.x+dx;offset.y=drag.y+dy;transform()}else{const piece=Array.from($('pieces').children).find(x=>state.tokens.find(t=>t.id===drag.token)?.name===x.textContent);if(piece){piece.style.left=drag.x+dx/zoom+'px';piece.style.top=drag.y+dy/zoom+'px'}}};document.onpointerup=e=>{if(drag&&!drag.pan)dispatch('move',{id:drag.token,x:drag.x+(e.clientX-drag.start[0])/zoom,y:drag.y+(e.clientY-drag.start[1])/zoom});drag=null};board.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(3,zoom*(e.deltaY<0?1.1:.9)));transform()};transform();
$('roomCode').value=new URLSearchParams(location.search).get('room')||'';
openDb().then(db=>{saveDb=db;const tx=db.transaction('saves');const req=tx.objectStore('saves').get('latest');req.onsuccess=()=>{if(req.result&&confirm('Há um autosave local. Carregar esta campanha?')){Object.assign(state,req.result);$('notice').textContent='Autosave restaurado. Crie a mesa.'}}}).catch(()=>{});
setInterval(()=>{if(hostMode&&state.updated)saveLocal()},30000);
window.addEventListener('beforeunload',e=>{if(hostMode){e.preventDefault();e.returnValue=''}});
</script></body></html>
