name: P2P browser tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Validar sintaxe da aplicação e dos testes
        run: |
          node --check browser-tests/p2p.spec.cjs
          node -e "const fs=require('fs'); const s=fs.readFileSync('p2p/index.html','utf8'); const a=s.lastIndexOf('<script>')+8; const b=s.lastIndexOf('</script>'); if(a<8||b<a)throw Error('Inline script não encontrado'); new Function(s.slice(a,b));"
      - name: Testar navegador
        id: browser
        run: npx playwright test --project=chromium --reporter=line --workers=1 --trace=retain-on-failure
        env:
          CI: 'true'
      - name: Publicar resultado do Playwright no commit
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ steps.browser.outcome }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then RESULT=success; DESC="Chromium smoke tests passed"; else RESULT=failure; DESC="Chromium smoke tests failed"; fi
          jq -n --arg state "$RESULT" --arg context "P2P browser tests" --arg description "$DESC" --arg target_url "https://github.com/$GH_REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/p2p-status.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/p2p-status.json \
            "https://api.github.com/repos/$GH_REPO/statuses/$GH_SHA"
      - name: Guardar diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
