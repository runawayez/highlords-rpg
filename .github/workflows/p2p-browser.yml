name: P2P browser tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser-tests/p2p.spec.cjs --reporter=line --workers=1 --trace=retain-on-failure
        env:
          CI: 'true'
      - name: Guardar diagnóstico quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
