<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highlords RPG — Mesa virtual</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#101217;color:#e6e8ed}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;background:#826fe5;border:0;border-radius:8px;color:white;padding:9px 13px}button:hover{filter:brightness(1.1)}button:disabled{opacity:.5}input,textarea{background:#1e222a;border:1px solid #3a3e48;border-radius:7px;color:#eee;padding:10px;min-width:0}input[type=checkbox]{accent-color:#826fe5}textarea{resize:vertical;width:100%}.hidden{display:none!important}#landing{min-height:100vh;display:grid;place-items:center;padding:20px}.intro{max-width:560px;width:100%;border:1px solid #30323a;background:#191c23;border-radius:18px;padding:28px}h1{font-size:30px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#9ca2ae;font-size:13px}.form{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.form>*{flex:1;min-width:120px}header{height:58px;padding:0 14px;background:#1a1d24;display:flex;align-items:center;gap:14px;border-bottom:1px solid #343744}header strong{white-space:nowrap}header .right{margin-left:auto;display:flex;gap:8px;align-items:center}#layout{display:grid;grid-template-columns:1fr 295px;height:calc(100vh - 58px)}#board{position:relative;background:#15181e;overflow:hidden;touch-action:none;cursor:grab}#world{position:absolute;transform-origin:0 0;width:1600px;height:1200px;background:#20242d}#background{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#grid{position:absolute;inset:0;pointer-events:none}#tokens{position:absolute;inset:0}.token{position:absolute;width:60px;height:60px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:700;text-align:center;font-size:12px;text-shadow:0 1px #000;box-shadow:0 3px 12px #0007;cursor:move;user-select:none;overflow:hidden;padding:3px}#side{display:flex;flex-direction:column;min-height:0;background:#191c23;border-left:1px solid #303540}.pane{padding:15px;border-bottom:1px solid #303540}.pane.flex{flex:1;min-height:0;display:flex;flex-direction:column}#history{overflow-y:auto;flex:1;margin-bottom:8px;font-size:13px}.entry{background:#222630;border-radius:7px;padding:9px;margin-bottom:7px;overflow-wrap:anywhere}.entry b{color:#c4b8ff}.smallrow{display:flex;align-items:center;gap:7px;margin:6px 0}.smallrow input[type=text],.smallrow input[type=number]{width:100%}.smallrow button{white-space:nowrap}.smallrow label{font-size:13px}#alert{position:fixed;bottom:20px;left:20px;background:#933d53;padding:12px 18px;border-radius:8px;z-index:999}#gmtools{max-height:250px;overflow:auto}#status{font-size:12px;color:#aeb4c0}a{color:#b5a8ff}@media(max-width:750px){#layout{grid-template-columns:1fr;height:auto}#board{height:60vh}#side{min-height:500px}header{flex-wrap:wrap;height:auto;min-height:58px;padding:10px}}
</style></head><body>
<div id="landing"><div class="intro"><h1>⚔ Highlords RPG</h1><p class="muted">Sua mesa virtual. Qualquer sistema. Simples, colaborativa e no navegador.</p><h2>Criar campanha</h2><div class="form"><input id="createTitle" placeholder="Nome da campanha" maxlength="80"><input id="createName" placeholder="Seu nome" maxlength="40"><button id="create">Criar mesa</button></div><hr style="border:0;border-top:1px solid #32353f;margin:26px 0"><h2>Entrar em campanha</h2><div class="form"><input id="joinCode" placeholder="Código (6 dígitos)" maxlength="6"><input id="joinName" placeholder="Seu nome" maxlength="40"><button id="join">Entrar</button></div><p class="muted">O anfitrião precisa manter o servidor ligado.</p></div></div>
<div id="game" class="hidden"><header><strong>⚔ Highlords RPG</strong><span id="campaign"></span><span id="status"></span><div class="right"><button id="invite">Copiar convite</button><button id="leave">Sair</button></div></header>
<div id="layout"><main id="board"><div id="world"><img id="background" alt=""><div id="grid"></div><div id="tokens"></div></div></main>
<aside id="side"><section class="pane"><h2>🎲 Dados</h2><div class="smallrow"><input id="dice" value="1d20" placeholder="1d20 ou 2d6+3"><button id="roll">Rolar</button></div><label id="secretRow"><input type="checkbox" id="secret"> Rolar em segredo (mestre)</label></section>
<section class="pane" id="gmtools"><h2>🛠 Ferramentas do mestre</h2><div class="smallrow"><input id="tokenName" placeholder="Nome do token"><input id="tokenColor" type="color" value="#dd8b60" style="max-width:48px;padding:2px"><button id="addToken">+ Token</button></div><div class="smallrow"><label for="mapImage">Mapa:</label><input id="mapImage" type="file" accept="image/png,image/jpeg,image/webp" style="max-width:190px"></div><div class="smallrow"><input id="sceneTitle" placeholder="Nome da cena"><button id="saveScene">Salvar cena</button></div><div class="smallrow"><label><input id="showGrid" type="checkbox" checked> Grade</label><label><input id="allowMove" type="checkbox" checked> Jogadores movem</label><input id="gridSize" type="number" value="64" min="25" max="150" title="Tamanho da grade" style="max-width:65px"></div><h2>Diário do mestre</h2><textarea id="notes" rows="3" placeholder="Suas anotações"></textarea><button id="saveNotes" style="margin-top:5px">Salvar diário</button></section>
<section class="pane flex"><h2>💬 Chat da mesa</h2><div id="history"></div><div class="smallrow"><input id="chatText" placeholder="Digite uma ação ou mensagem" maxlength="1200"><button id="chatSend">Enviar</button></div></section></aside></div></div><div id="alert" class="hidden" role="alert"></div>
<script>
const $=id=>document.getElementById(id);let room=null,key='',stream=null,me=null,scale=.65,pan={x:60,y:50},drag=null;
const query=new URLSearchParams(location.search);
function error(e){const box=$('alert');box.textContent=e.message||e;box.classList.remove('hidden');setTimeout(()=>box.classList.add('hidden'),4200)}
async function api(path,payload){const res=await fetch(path,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});let data=await res.json();if(!res.ok)throw Error(data.error||'Erro de conexão');return data;}
async function create(){try{const r=await api('/api/rooms',{title:$('createTitle').value,name:$('createName').value});enter(r.room,r.key);}catch(e){error(e)}}
async function join(){try{const code=$('joinCode').value.trim().toUpperCase(),r=await api('/api/rooms/'+code+'/join',{name:$('joinName').value});enter(r.room,r.key);}catch(e){error(e)}}
function enter(r,k){key=k;localStorage.setItem('highlords-'+r.code,k);history.replaceState(null,'','?room='+r.code);$('landing').classList.add('hidden');$('game').classList.remove('hidden');update(r);connect(r.code);}
function connect(code){stream?.close();stream=new EventSource('/api/rooms/'+code+'/events?key='+encodeURIComponent(key));stream.addEventListener('state',e=>update(JSON.parse(e.data)));stream.onerror=()=>{$('status').textContent='Reconectando...'}}
function update(r){room=r;me=r.players.find(p=>p.key===key)||r.players.find(p=>p.id===me?.id)||null; /* keys are deliberately omitted in room views */ if(!me){me=r.players.find(p=>p.gm) && !sessionStorage.getItem('role-'+r.code)?null:me}const role=sessionStorage.getItem('role-'+r.code);const gm=role==='gm';$('campaign').textContent=r.title+' · '+r.code;$('status').textContent=r.players.length+' participante(s)';$('gmtools').classList.toggle('hidden',!gm);$('secretRow').classList.toggle('hidden',!gm);$('sceneTitle').value=r.scene.title;$('showGrid').checked=r.scene.grid;$('gridSize').value=r.scene.gridSize;$('allowMove').checked=r.settings.playersMove;
if(document.activeElement!==$('notes'))$('notes').value=r.notes||'';
$('background').src=r.scene.background||'';$('background').style.display=r.scene.background?'block':'none';
$('grid').style.backgroundImage=r.scene.grid?'linear-gradient(to right,#ffffff19 1px,transparent 1px),linear-gradient(to bottom,#ffffff19 1px,transparent 1px)':'none';$('grid').style.backgroundSize=r.scene.gridSize+'px '+r.scene.gridSize+'px';
const container=$('tokens');container.replaceChildren();for(const t of r.tokens){const el=document.createElement('div');el.className='token';el.textContent=t.name;el.title=t.name+(gm?' — clique com botão direito para remover':'');el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.background=t.color;el.dataset.id=t.id;el.addEventListener('pointerdown',ev=>{if(ev.button!==0||(!gm&&!r.settings.playersMove))return;ev.stopPropagation();el.setPointerCapture(ev.pointerId);drag={type:'token',id:t.id,sx:ev.clientX,sy:ev.clientY,ox:t.x,oy:t.y,el};});el.addEventListener('contextmenu',ev=>{ev.preventDefault();if(gm&&confirm('Remover '+t.name+'?'))act('token:remove',{id:t.id})});container.append(el)}
const list=$('history');const atBottom=list.scrollTop+list.clientHeight>=list.scrollHeight-40;list.replaceChildren();for(const line of r.log){const item=document.createElement('div');item.className='entry';const label=document.createElement('b');label.textContent=line.name+': ';item.append(label);const span=document.createElement('span');span.textContent=line.type==='roll'?'🎲 '+line.expr+' → '+line.values.join(', ')+' = '+line.total+(line.secret?' (secreto)':''):line.text;item.append(span);list.append(item)}if(atBottom)list.scrollTop=list.scrollHeight;render();}
function render(){$('world').style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+scale+')'}
async function act(type,payload={}){if(!room)return;try{await api('/api/rooms/'+room.code+'/action',{key,type,payload})}catch(e){error(e)}}
$('create').onclick=async()=>{await create();if(room)sessionStorage.setItem('role-'+room.code,'gm');if(room)update(room)};
$('join').onclick=async()=>{await join();if(room)sessionStorage.setItem('role-'+room.code,'player');if(room)update(room)};
$('leave').onclick=()=>{stream?.close();location.href='/'};
$('invite').onclick=async()=>{const url=location.origin+'/?room='+room.code;try{await navigator.clipboard.writeText(url);$('status').textContent='Link copiado'}catch{prompt('Copie o convite',url)}};
$('roll').onclick=()=>act('roll',{expr:$('dice').value,secret:$('secret').checked});
$('chatSend').onclick=()=>{const text=$('chatText').value.trim();if(text){$('chatText').value='';act('chat',{text})}};
$('chatText').addEventListener('keydown',e=>{if(e.key==='Enter'){$('chatSend').click()}});
$('addToken').onclick=()=>act('token:add',{name:$('tokenName').value||'Token',color:$('tokenColor').value,x:300,y:260});
$('saveScene').onclick=()=>act('scene',{title:$('sceneTitle').value,grid:$('showGrid').checked,gridSize:$('gridSize').value,playersMove:$('allowMove').checked});
$('saveNotes').onclick=()=>act('notes',{text:$('notes').value});
$('mapImage').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>4000000)return error('Imagem limitada a 4 MB');const reader=new FileReader();reader.onload=async()=>{try{await api('/api/rooms/'+room.code+'/upload',{key,data:reader.result})}catch(e){error(e)}};reader.readAsDataURL(f)};
$('board').addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;drag={type:'pan',sx:e.clientX,sy:e.clientY,ox:pan.x,oy:pan.y};$('board').setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='pan'){pan.x=drag.ox+e.clientX-drag.sx;pan.y=drag.oy+e.clientY-drag.sy;render()}else if(drag.el){drag.el.style.left=(drag.ox+(e.clientX-drag.sx)/scale)+'px';drag.el.style.top=(drag.oy+(e.clientY-drag.sy)/scale)+'px'}});
document.addEventListener('pointerup',e=>{if(!drag)return;if(drag.type==='token')act('token:move',{id:drag.id,x:drag.ox+(e.clientX-drag.sx)/scale,y:drag.oy+(e.clientY-drag.sy)/scale});drag=null});
$('board').addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.2,Math.min(2.5,scale*(e.deltaY>0?.9:1.1)));render()},{passive:false});
if(query.get('room')){$('joinCode').value=query.get('room').toUpperCase();const code=$('joinCode').value,stored=localStorage.getItem('highlords-'+code);if(stored){api('/api/rooms/'+code+'?key='+encodeURIComponent(stored)).then(x=>enter(x.room,stored)).catch(()=>{})}}
render();
</script></body></html>
